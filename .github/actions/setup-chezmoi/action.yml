name: Setup chezmoi
description: Install a pinned, checksum-verified chezmoi release and put it on PATH.
# The pinned version and hashes live in install-chezmoi.sh, which the pkg-bump action shares.
runs:
  using: composite
  steps:
    - name: Install chezmoi
      shell: bash
      run: '"$GITHUB_ACTION_PATH/install-chezmoi.sh"'
    - name: Check chezmoi
      shell: bash
      run: chezmoi --version
