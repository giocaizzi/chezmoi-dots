name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build cross-platform binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          v=${VERSION#v}
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            ext=; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.buildVersion=${v}" \
              -o "dist/chezmoi-dots_${v}_${os}_${arch}${ext}" ./cmd/chezmoi-dots
            # Also create dots named binaries for standalone use
            cp "dist/chezmoi-dots_${v}_${os}_${arch}${ext}" "dist/dots_${v}_${os}_${arch}${ext}"
          done
          cd dist && sha256sum * > checksums.txt
      - uses: actions/attest@v4
        with:
          subject-checksums: dist/checksums.txt
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "chezmoi-dots ${TAG#v}" --generate-notes --verify-tag
